<!DOCTYPE html>
<html>
<head>
  <title>Chaveamento (somente leitura)</title>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    .luta {
      border: 2px solid #000;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
    }

    .pendente { color: #555; }
    .finalizada { color: green; font-weight: bold; }
    .cancelada { color: #999; font-style: italic; }

    h1, h2, h3 { margin-bottom: 10px; }

    .aviso {
      background: #fff3cd;
      border: 1px solid #ffe08a;
      padding: 8px 12px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="aviso">📺 Esta tela é apenas de visualização. Resultados são registrados na tela de Área.</div>
<br>

<h1 id="titulo"></h1>
<h2 id="tipo"></h2>

<div id="conteudo"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="judo-store.js"></script>
<script>
// ================= DADOS =================
// Guarda só o ID: o restante é sempre relido do motor (judo-store.js),
// para refletir automaticamente qualquer resultado registrado na área.
let categoriaRef = JSON.parse(localStorage.getItem("categoriaAtual"));
let categoriaId = Number(new URLSearchParams(location.search).get("categoria"))
  || (categoriaRef && categoriaRef.id);

if (!categoriaId) {
  document.body.innerHTML = "<h2>Erro: nenhuma categoria carregada</h2>";
  throw new Error("Sem dados");
}

function rotuloTipo(tipo) {
  if (tipo === "melhorDe3") return "Melhor de 3";
  if (tipo === "rodizio") return "Rodízio";
  return "Mata-mata";
}

function textoStatus(l) {
  if (l.status === "finalizada") {
    let tipoTexto = l.tipoVitoria ? ` (${l.tipoVitoria})` : "";
    return `<span class="finalizada">✔ Vencedor: ${l.vencedor}${tipoTexto}</span>`;
  }
  if (l.status === "cancelada") {
    return `<span class="cancelada">Cancelada (série já decidida)</span>`;
  }
  return `<span class="pendente">Pendente</span>`;
}

function localDaLuta(l) {
  let area = getAreaDaLuta(l.id);
  return area ? ` — Área ${area.id}` : "";
}

// ================= RENDER (somente leitura) =================
function render() {
  let categoria = getCategoriaPorId(categoriaId);
  if (!categoria) {
    document.body.innerHTML = "<h2>Categoria não encontrada</h2>";
    return;
  }

  let lutas = getLutasPorCategoria(categoriaId);

  document.getElementById("titulo").innerText = categoria.nome;
  document.getElementById("tipo").innerText = rotuloTipo(categoria.tipo);

  let html = "";

  if (categoria.tipo === "melhorDe3") {
    lutas.sort((a, b) => a.fase - b.fase).forEach(l => {
      html += `
        <div class="luta">
          <h3>Luta ${l.fase}</h3>
          <strong>${l.atletaA} 🆚 ${l.atletaB}</strong>${localDaLuta(l)}<br>
          ${textoStatus(l)}
        </div>
      `;
    });
  }

  else if (categoria.tipo === "rodizio") {
    let porRodada = {};
    lutas.forEach(l => {
      porRodada[l.fase] = porRodada[l.fase] || [];
      porRodada[l.fase].push(l);
    });

    Object.keys(porRodada).sort((a, b) => a - b).forEach(fase => {
      html += `<h3>Rodada ${fase}</h3>`;
      porRodada[fase].sort((a, b) => a.posicao - b.posicao).forEach(l => {
        html += `
          <div class="luta">
            <strong>${l.atletaA} 🆚 ${l.atletaB}</strong>${localDaLuta(l)}<br>
            ${textoStatus(l)}
          </div>
        `;
      });
    });

    let ranking = Object.entries(categoria.tabela || {});
    ranking.sort((a, b) => {
      if (b[1].vitorias !== a[1].vitorias) return b[1].vitorias - a[1].vitorias;
      return b[1].pontos - a[1].pontos;
    });

    html += "<h3>🏆 Classificação</h3>";
    ranking.forEach((r, i) => {
      html += `<p>${i + 1}º ${r[0]} - ${r[1].vitorias} vitórias - ${r[1].pontos} pts</p>`;
    });
  }

  else { // mataMata
    let porFase = {};
    lutas.forEach(l => {
      porFase[l.fase] = porFase[l.fase] || [];
      porFase[l.fase].push(l);
    });

    Object.keys(porFase).sort((a, b) => a - b).forEach(fase => {
      html += `<h3>Fase ${fase}</h3>`;
      porFase[fase].sort((a, b) => a.posicao - b.posicao).forEach(l => {
        html += `
          <div class="luta">
            <strong>${l.atletaA} 🆚 ${l.atletaB}</strong>${localDaLuta(l)}<br>
            ${textoStatus(l)}
          </div>
        `;
      });
    });
  }

  if (categoria.finalizada && categoria.resultadoFinal) {
    let r = categoria.resultadoFinal;
    html += `<h2>🏆 1º ${r.campeao}</h2><h3>🥈 2º ${r.vice}</h3>`;
    if (r.terceiro) html += `<h3>🥉 3º ${r.terceiro}</h3>`;
  }

  document.getElementById("conteudo").innerHTML = html;
}

iniciarStore().then(() => {
  render();
  onStoreUpdate(() => render());
});
</script>

</body>
</html>
